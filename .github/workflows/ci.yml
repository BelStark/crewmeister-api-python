name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target test -t crewmeister-api:test .

  sdk-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify base SDK, CLI, and MCP extras offline
        run: docker build --target sdk-artifacts --output type=local,dest=dist/sdk .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crewmeister-api
          path: dist/sdk/
          if-no-files-found: error
      - name: Export the verified consumer plugin
        run: docker build --target plugin-artifacts --output type=local,dest=dist/plugins .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crewmeister-plugin
          path: dist/plugins/
          include-hidden-files: true
          if-no-files-found: error

  docker-build:
    if: vars.CI_DOCKER_BUILD == '1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull --target test -t crewmeister-api:test .
      - run: docker build --pull -t crewmeister-api:runtime .
      - run: docker run --rm --network none crewmeister-api:runtime --help
