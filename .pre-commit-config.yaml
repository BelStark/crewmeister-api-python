default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false
      - id: black
        name: black
        entry: uv run --no-sync black .
        language: system
        types: [python]
        pass_filenames: false
      - id: unit-tests
        name: unit tests
        entry: docker build --target test -t crewmeister-api:test .
        language: system
        pass_filenames: false
        always_run: true
